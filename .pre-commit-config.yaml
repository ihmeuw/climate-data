repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-ast
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-json
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
-   repo: local
    hooks:
      - id: ruff-format
        name: ruff-format
        entry: poetry run ruff format
        require_serial: true
        language: system
        types: [ python ]
      - id: ruff
        name: ruff
        # Add --fix, in case you want it to autofix when this hook runs
        entry: poetry run ruff check --force-exclude --fix
        require_serial: true
        language: system
        types: [ python ]
      - id: mypy
        name: mypy
        # Name the source roots rather than `.`: with pass_filenames: false this hook
        # walks the whole working tree, so an untracked scratch/ directory fails the
        # hook locally on errors CI never sees. These three roots cover every tracked
        # .py file (43 files, same set as `mypy $(git ls-files '*.py')`).
        entry: poetry run mypy src tests scripts
        require_serial: true
        language: system
        types: [python]
        pass_filenames: false
      - id: kacl-verify
        name: kacl-verify
        entry: poetry run kacl-cli verify
        language: system
        files: 'CHANGELOG.md'
        pass_filenames: false
