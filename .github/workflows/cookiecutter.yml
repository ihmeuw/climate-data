# RETIRED 21Jul2026 (see CLIMATE-24). This workflow runs `cruft update` to sync the repo with
# its cookiecutter template. It previously used a personal PAT (secrets.GH_TOKEN) owned by a
# maintainer who has left IHME; when that token became invalid the workflow stopped working.
# It now uses the built-in GITHUB_TOKEN (no PAT), which CANNOT create/update files under
# .github/workflows/** and whose PRs do not trigger CI -- so template-sync no longer functions
# and the daily `schedule:` trigger has been removed (workflow_dispatch only).
#
# TO REVIVE (CLIMATE-24): provision a NON-personal credential -- an org secret or a GitHub App
# installation token, NOT a personal PAT (a personal PAT re-creates the "dies when the owner
# leaves" failure) -- scoped contents:write, pull-requests:write, workflows:write. Store it as
# e.g. secrets.CRUFT_TOKEN, point the env/token in the "Create Pull Request" step at it, and
# re-add the `schedule:` trigger below.
name: Autoupdate project structure
on:
  workflow_dispatch:

jobs:
  auto-update-project:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install cruft poetry jello tabulate

      - name: Update project structure
        run: |
          cruft update -y

      - name: Check if there are changes
        id: changes
        run: |
          git status --porcelain | wc -l
          echo "changed=$(git status --porcelain | wc -l)" >> "$GITHUB_OUTPUT"


      - name: apply additional changes and fixes
        if: steps.changes.outputs.changed > 0
        run: |
          poetry lock  # add new dependencies
          poetry install
          poetry run pre-commit run -a || true  # we have to fix other issues manually

      - name: Get template versions
        id: get_versions
        if: steps.changes.outputs.changed > 0
        shell: bash
        run: |
          CURRENT_VERSION=$(git show HEAD:.cruft.json | jello -r "_['commit'][:8]")
          NEXT_VERSION=$(jello -r "_['commit'][:8]" < .cruft.json)
          echo "current_version=$CURRENT_VERSION next_version=$NEXT_VERSION"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "next_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Get changelog
        id: get_changelog
        if: steps.changes.outputs.changed > 0
        shell: bash
        run: |
          TEMPLATE=$(jello -r "_['template']" < .cruft.json)
          git clone "$TEMPLATE" /tmp/template
          cd /tmp/template
          body=$( (echo "Date;Change;Hash"; git log --pretty=format:"%as;%s;%h" ${{ steps.get_versions.outputs.current_version }}..${{ steps.get_versions.outputs.next_version }}) | tabulate --header --format github -s ';' -)
          body=$(cat <<EOF
          Changes from $TEMPLATE

          $body
          EOF
          )

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          {
            echo "changelog<<$EOF"
            echo "$body"
            echo "$EOF"
          } >> "$GITHUB_OUTPUT"
          echo "$body"

      # behaviour if PR already exists: https://github.com/marketplace/actions/create-pull-request#action-behaviour
      - name: Create Pull Request
        env:
          # Built-in token (no PAT). NOTE: cannot create/update workflow files, so cruft
          # updates that touch .github/workflows/** will fail here. See CLIMATE-24 to revive.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ steps.changes.outputs.changed > 0 && env.GITHUB_TOKEN != 0 }}
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ env.GITHUB_TOKEN }}
          commit-message: >-
            chore: update project structure to ${{ steps.get_versions.outputs.next_version }}
          title: "[Actions] Auto-Update cookiecutter template"
          body: ${{ steps.get_changelog.outputs.changelog }}
          branch: chore/auto-update-project-from-template
          delete-branch: true
